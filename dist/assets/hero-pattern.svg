<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" fill="none">
  <defs>
    <radialGradient id="nocturneGlow" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4361EE" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#080B11" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="limeGlow" cx="80%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#D4F64E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#080B11" stop-opacity="0"/>
    </radialGradient>
    <pattern id="precisionGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E2740" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#D4F64E" fill-opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1200" height="640" fill="#080B11"/>
  <rect width="1200" height="640" fill="url(#nocturneGlow)"/>
  <rect width="1200" height="640" fill="url(#limeGlow)"/>
  <rect width="1200" height="640" fill="url(#precisionGrid)"/>
  
  <!-- Architectural Lisbon Riverfront & Tagus Latitude Grid -->
  <g stroke="#1E2740" stroke-width="1" opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="640" stroke-dasharray="4 6"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke-dasharray="4 6"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke-dasharray="2 4"/>
    <line x1="0" y1="520" x2="1200" y2="520" stroke-dasharray="2 4"/>
  </g>

  <!-- Technical Astrolabe Ring -->
  <g transform="translate(600, 320)" opacity="0.18">
    <circle r="220" stroke="#D4F64E" stroke-width="1" stroke-dasharray="8 12"/>
    <circle r="180" stroke="#4361EE" stroke-width="0.8"/>
    <circle r="140" stroke="#D4F64E" stroke-width="1.2" stroke-dasharray="3 6"/>
    <line x1="-240" y1="0" x2="240" y2="0" stroke="#D4F64E" stroke-width="0.75"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="#D4F64E" stroke-width="0.75"/>
  </g>
</svg>
