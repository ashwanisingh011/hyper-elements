    <radialGradient id="glow2" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00D1B2" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
